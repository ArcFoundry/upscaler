[package]
name = "upscaler-wasm"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM classical scalers (bicubic + Lanczos) for the @arcfoundry/upscaler engine."
license = "MIT"
repository = "https://github.com/arcfoundry/upscaler"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly so the wasm-bindgen-cli version used to generate the JS glue
# always matches the runtime crate (they must never drift apart).
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
